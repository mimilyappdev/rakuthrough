<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RakuThrough — メンテナンス中</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f4f0;
  font-family: 'Zen Maru Gothic', sans-serif;
  color: #1a1a18;
  padding: 24px;
}
.card {
  background: #fff;
  border-radius: 24px;
  padding: 48px 40px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  border: 1px solid rgba(0,0,0,0.06);
}
.logo {
  font-family: 'Nunito', sans-serif;
  font-size: 2rem;
  font-weight: 900;
  color: #1a56db;
  letter-spacing: -0.5px;
  margin-bottom: 28px;
}
.icon {
  font-size: 3rem;
  margin-bottom: 20px;
  display: block;
}
h1 {
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 12px;
  color: #1a1a18;
}
p {
  font-size: 0.95rem;
  color: #6b6a64;
  line-height: 1.8;
}
.badge {
  display: inline-block;
  margin-top: 28px;
  padding: 6px 16px;
  border-radius: 999px;
  background: #e8f0fb;
  color: #1a56db;
  font-size: 0.82rem;
  font-weight: 700;
}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">RakuThrough</div>
    <span class="icon">🛠️</span>
    <h1>ただいまメンテナンス中です</h1>
    <p>より使いやすくするためのアップデートを行っています。<br>しばらくお待ちください。</p>
    <span class="badge">準備中</span>
  </div>
</body>
</html>
